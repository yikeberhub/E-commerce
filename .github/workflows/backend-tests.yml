name: Backend tests

on:
  push:
    branches: [main, render]
  pull_request:
    branches: [main, render]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/electroshop
    env:
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        # requirements.txt pins psycopg2 (source build, not -binary) for
        # production; it needs libpq's headers to compile even though CI
        # itself runs against sqlite.
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test
