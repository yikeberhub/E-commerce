name: Backend tests

on:
  push:
    branches: [main, render]
  pull_request:
    branches: [main, render]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/electroshop
    env:
      SECRET_KEY: test-secret-key-for-ci-only
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        # requirements.txt pins psycopg2 (source build, not -binary) for
        # production; it needs libpq's headers to compile even though CI
        # itself runs against sqlite.
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Check requirements.txt encoding
        # This file has twice been silently re-saved as UTF-16 (by an
        # editor, not git) which pip can't parse and Render's build fails
        # on. Catch it here loudly instead of at deploy time.
        run: |
          if grep -qP '\x00' requirements.txt; then
            echo "::error file=requirements.txt::File contains null bytes — it's been saved as UTF-16, not UTF-8. Re-save as UTF-8."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test
